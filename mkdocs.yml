site_name: Trackers
exclude_docs: |
  AGENTS.md
site_url: !ENV [SITE_URL, "https://trackers.roboflow.com/latest/"]
site_author: Roboflow
site_description: A unified library for object tracking featuring clean room re-implementations of leading multi-object tracking algorithms.
repo_name: roboflow/trackers
repo_url: https://github.com/roboflow/trackers
edit_uri: https://github.com/roboflow/trackers/tree/develop/docs
copyright: >
  Roboflow 2026. All rights reserved. |
  <a href="https://roboflow.com/privacy">Privacy Policy</a> |
  <a href="https://roboflow.com/terms">Terms of Service</a>

hooks:
  - docs/hooks/doctest_filter.py
  - docs/hooks/schema_inject.py

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/roboflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/trackers
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/roboflow
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/roboflow
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/roboflow-ai/
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/roboflow
    - icon: fontawesome/brands/discord
      link: https://discord.gg/GbfgXGJ8Bk

theme:
  name: material
  custom_dir: docs/overrides/
  icon:
    edit: material/pencil
  logo: assets/logo-trackers-violet.svg
  favicon: assets/logo-trackers-black.svg
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.tracking
    - navigation.expand
    - navigation.tabs

extra_css:
  - stylesheets/style.css
  - stylesheets/rf.css
  - stylesheets/command_builder.css

extra_javascript:
  - javascripts/pycon_copy.js
  - javascripts/mathjax.js
  - javascripts/cli_builder_framework.js
  - javascripts/command_builder.js

markdown_extensions:
   # Adds support for card grids
  - attr_list
  - md_in_html
  # Enables the use of icons and emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Code syntax highlighting with line numbers and anchors
  - pymdownx.highlight:
      # Adds anchors to line numbers
      anchor_linenums: true
      # Wraps lines in span elements
      line_spans: __span
      # Adds language class to code blocks
      pygments_lang_class: true
  # Enables inline code highlighting
  - pymdownx.inlinehilite
  # Enables LaTeX-style math in Markdown
  - pymdownx.arithmatex:
      generic: true
  # Allows including content from other files
  - pymdownx.snippets:
      # Fails the build on a broken/typo'd include path instead of rendering a warning comment
      check_paths: true
  # Enables nested code blocks and custom fences
  - pymdownx.superfences
  # Adds support for callouts/notes/warnings
  - admonition
  # Enables collapsible blocks (expandable content)
  - pymdownx.details
  # Creates tabbed content (like installation examples)
  - pymdownx.tabbed:
      # Uses an alternative styling for tabs
      alternate_style: true

plugins:
  - search
  - redirects:
      redirect_maps:
        learn/install.md: guides/install.md
        learn/track.md: guides/track.md
        learn/cli.md: guides/cli.md
        learn/cli-migration.md: guides/migration_cli.md
        learn/dynamic-frame-rate.md: guides/dynamic-frame-rate.md
        learn/download.md: evaluations/download.md
        learn/evaluate.md: evaluations/evaluate.md
        learn/tune.md: guides/tune.md
        learn/mcbyte-benchmark.md: evaluations/benchmark-runner.md
        learn/inspect.md: guides/inspect.md
        learn/detection-quality.md: guides/detection-quality.md
        learn/state-estimators.md: guides/state-estimators.md
        learn/iou.md: guides/iou.md
        learn/about.md: details.md
        guides/download.md: evaluations/download.md
        guides/evaluate.md: evaluations/evaluate.md
        guides/mcbyte-benchmark.md: evaluations/benchmark-runner.md
        benchmarking/mcbyte-benchmark.md: evaluations/benchmark-runner.md
        benchmarking/mcbyte-benchmark-runner.md: evaluations/benchmark-runner.md
        guides/about.md: details.md
        trackers/comparison.md: evaluations/results.md
        benchmarking/download.md: evaluations/download.md
        benchmarking/evaluate.md: evaluations/evaluate.md
        benchmarking/benchmark-runner.md: evaluations/benchmark-runner.md
        benchmarking/results.md: evaluations/results.md
        benchmarking/methodology.md: evaluations/methodology.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date
  - mkdocstrings:
      handlers:
        python:
          options:
            # Controls whether to show symbol types in the table of contents
            show_symbol_type_toc: true
            # Controls whether to show symbol type in the heading
            show_symbol_type_heading: true
            # Controls whether to show the root heading (module/class name)
            show_root_heading: true
            # Controls whether to show the source code
            show_source: false
            # Specifies the docstring style to parse (Google style in this case)
            docstring_style: google
            # Controls the order of members (by source order in this case)
            members_order: source

            extra:
              # Controls whether to sort members alphabetically
              sort_members: false

nav:
  - Home:
    - Quickstart: index.md
    - Details: details.md
  - Usage:
    - Install Trackers: guides/install.md
    - Track Objects: guides/track.md
    - CLI Reference: guides/cli.md
  - Tuning:
    - Dynamic Frame Rate: guides/dynamic-frame-rate.md
    - Detection Quality Matters: guides/detection-quality.md
    - Tune Trackers: guides/tune.md
    - IoU Variants: guides/iou.md
    - State Estimators: guides/state-estimators.md
  - Developer:
    - Inspect Mask Pipeline: guides/inspect.md
  - Evaluations:
    - Download Datasets: evaluations/download.md
    - Benchmark Trackers: evaluations/evaluate.md
    - Benchmark Runner: evaluations/benchmark-runner.md
    - Results: evaluations/results.md
    - Methodology: evaluations/methodology.md
  - Trackers:
    - SORT: trackers/sort.md
    - ByteTrack: trackers/bytetrack.md
    - OC-SORT: trackers/ocsort.md
    - BoT-SORT: trackers/botsort.md
    - C-BIoU: trackers/cbiou.md
    - McByte: trackers/mcbyte.md
  - API Reference:
    - Trackers: api/trackers.md
    - Motion: api/motion.md
    - Datasets: api/datasets.md
    - Evals: api/evals.md
    - I/O: api/io.md
    - "Migration: CLI": guides/migration_cli.md
    - Changelog: changelog.md
  - Community:
    - Contributing: contributing.md
    - Code of Conduct: code-of-conduct.md
    - Governance: governance.md
